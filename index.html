<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recomp Training Log</title>
<meta name="description" content="Per-set workout checklist for the Day A, B, C recomp program.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#ECEFEA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1318" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Recomp">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root {
  /* Layout: one phone-width column. Sticky header with the day tabs, then checklist cards; a fixed dock carries progress, Finish and the rest timer. */
  color-scheme: light;
  --bg: #ECEFEA;
  --grid: rgba(23, 32, 42, .05);
  --surface: #FAFBF8;
  --surface-2: #F0F3EE;
  --ink: #17202A;
  --muted: #56626E;
  --faint: #8A949E;
  --rule: #D5DBD3;
  --rule-strong: #B9C2B9;
  --accent: #1E4FD6;
  --accent-ink: #FFFFFF;
  --accent-soft: rgba(30, 79, 214, .10);
  --accent-inv: #A5BEFF;
  --done: #157A41;
  --done-ink: #FFFFFF;
  --done-soft: rgba(21, 122, 65, .09);
  --done-line: rgba(21, 122, 65, .36);
  --cue: #6E4700;
  --cue-bg: #FAEDC4;
  --cue-dot: #D49600;
  --danger: #B42318;
  --danger-ink: #FFFFFF;
  --scrim: rgba(10, 14, 18, .45);
  --knob: #FFFFFF;
  --lift: 0 1px 2px rgba(23, 32, 42, .06);
  --plate-45: #2557D6;
  --plate-35: #DFAD0C;
  --plate-25: #23914F;
  --plate-10: #F4F5F2;
  --plate-5: #3C4550;
  --plate-2: #7A838C;
  --steel: #A3ABB3;
  --f-display: "Big Shoulders Display", "Barlow Condensed", "Arial Narrow", sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 14px;
  --dock-space: 110px;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1318; --grid: rgba(230, 235, 238, .035); --surface: #161D24; --surface-2: #1D252D;
    --ink: #E6EBEE; --muted: #9AA6B1; --faint: #6E7A86; --rule: #27313B; --rule-strong: #3A4654;
    --accent: #85A8FF; --accent-ink: #0A1222; --accent-soft: rgba(133, 168, 255, .14); --accent-inv: #1E4FD6;
    --done: #3FC27A; --done-ink: #04150B; --done-soft: rgba(63, 194, 122, .12); --done-line: rgba(63, 194, 122, .42);
    --cue: #F2C75A; --cue-bg: rgba(242, 199, 90, .12); --cue-dot: #F2C75A;
    --danger: #FF7C70; --danger-ink: #200805; --scrim: rgba(0, 0, 0, .6); --knob: #F3F5F7; --lift: none;
    --plate-10: #D8DDE1; --plate-5: #5A6470; --plate-2: #848E98; --steel: #6C7781;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1318; --grid: rgba(230, 235, 238, .035); --surface: #161D24; --surface-2: #1D252D;
  --ink: #E6EBEE; --muted: #9AA6B1; --faint: #6E7A86; --rule: #27313B; --rule-strong: #3A4654;
  --accent: #85A8FF; --accent-ink: #0A1222; --accent-soft: rgba(133, 168, 255, .14); --accent-inv: #1E4FD6;
  --done: #3FC27A; --done-ink: #04150B; --done-soft: rgba(63, 194, 122, .12); --done-line: rgba(63, 194, 122, .42);
  --cue: #F2C75A; --cue-bg: rgba(242, 199, 90, .12); --cue-dot: #F2C75A;
  --danger: #FF7C70; --danger-ink: #200805; --scrim: rgba(0, 0, 0, .6); --knob: #F3F5F7; --lift: none;
  --plate-10: #D8DDE1; --plate-5: #5A6470; --plate-2: #848E98; --steel: #6C7781;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: var(--bg); }
body {
  margin: 0;
  background-color: var(--bg);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 22px 22px;
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(var(--dock-space) + 12px);
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
body.no-scroll { overflow: hidden; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; background: none; border: 0; margin: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
button:disabled { opacity: .38; cursor: default; }
input, select, textarea { font: inherit; color: inherit; margin: 0; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.vh { position: absolute !important; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.wrap { max-width: 560px; margin: 0 auto; }
svg { display: block; }

/* Header */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9;
  background: var(--bg);
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px))) calc(-1 * max(16px, env(safe-area-inset-right, 0px)));
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--rule);
}
.top-in { max-width: 560px; margin: 0 auto; padding-block: 10px; display: grid; gap: 10px; }
.brand-row { display: flex; align-items: center; gap: 6px; }
.brand { flex: 1; min-width: 0; display: grid; gap: 3px; }
.wordmark { font-family: var(--f-display); font-weight: 800; font-size: 29px; line-height: .86; text-transform: uppercase; letter-spacing: .01em; }
.hdr-meta { font-family: var(--f-mono); font-size: 11px; font-weight: 500; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sync { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--rule); font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; margin-right: 2px; }
.sync-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--done); flex: none; }
.sync[data-state="stale"] { color: var(--cue); background: var(--cue-bg); border-color: transparent; }
.sync[data-state="stale"] .sync-dot { background: var(--cue-dot); }
.sync[data-state="none"] .sync-dot { background: var(--danger); }
.icon-btn { width: 40px; height: 40px; flex: none; display: grid; place-items: center; border-radius: 11px; color: var(--ink); }
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn[aria-current="page"] { background: var(--ink); color: var(--bg); }
@media (max-width: 359px) { #saveText { display: none; } .sync { padding: 0 9px; } }

.tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(0, 1.3fr); gap: 6px; }
.tab { position: relative; display: grid; align-content: start; justify-items: start; gap: 3px; min-height: 58px; padding: 9px 10px 8px; border-radius: 12px; background: var(--surface); border: 1px solid var(--rule); text-align: left; transition: background .15s, color .15s; }
.tab-big { font-family: var(--f-display); font-weight: 800; font-size: 27px; line-height: .86; }
.tab-c .tab-big { font-size: 22px; line-height: 1; padding-top: 2px; }
.tab-sub { font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.tab.is-going .tab-sub { font-family: var(--f-mono); letter-spacing: 0; font-size: 11.5px; color: var(--done); }
.tab-next { position: absolute; top: 8px; right: 8px; font-size: 9.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); }
.tab.is-active { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.tab.is-active .tab-sub { color: inherit; opacity: .72; }
.tab.is-active .tab-next { color: var(--accent-inv); }
.subnav { display: flex; align-items: center; gap: 12px; min-height: 44px; }
.subnav h2 { font-family: var(--f-display); font-weight: 800; font-size: 27px; line-height: 1; text-transform: uppercase; }
.back { display: inline-flex; align-items: center; gap: 4px; height: 40px; padding: 0 14px 0 8px; border-radius: 11px; border: 1px solid var(--rule); background: var(--surface); font-weight: 600; font-size: 14px; }
.back svg { width: 16px; height: 16px; }

/* Week strip */
.week { margin-top: 14px; padding: 10px 12px 10px; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); box-shadow: var(--lift); }
.week-sum { display: flex; align-items: baseline; gap: 12px; font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.week-k { flex: 1; }
.tally b { font-family: var(--f-mono); font-size: 13px; color: var(--ink); letter-spacing: 0; margin-right: 1px; }
.tally.is-met b { color: var(--done); }
.week-days { list-style: none; margin: 8px 0 0; padding: 0; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.wd { display: grid; justify-items: center; gap: 3px; padding: 5px 0 6px; border-radius: 9px; }
.wd.is-today { background: var(--accent-soft); }
.wd-n { font-size: 10px; font-weight: 700; color: var(--faint); letter-spacing: .04em; }
.wd-d { font-family: var(--f-mono); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.wd.is-today .wd-d { color: var(--accent); font-weight: 600; }
.wd-m { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; min-height: 18px; align-items: center; }
.mk { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; font-style: normal; font-family: var(--f-display); font-weight: 800; font-size: 13px; line-height: 1; }
.mk-l { background: var(--accent); color: var(--accent-ink); }
.mk-c { background: var(--done-soft); color: var(--done); }
.mk-c svg { width: 12px; height: 12px; }
.mk-none { width: 5px; height: 5px; border-radius: 50%; background: var(--rule-strong); }

/* Banners */
.banner { margin-top: 12px; padding: 12px 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--rule); display: grid; gap: 10px; }
.banner p { font-size: 14.5px; line-height: 1.45; }
.banner.warn { background: var(--cue-bg); border-color: transparent; color: var(--cue); }
.banner.deload { background: var(--accent-soft); border-color: transparent; }
.banner-acts { display: flex; flex-wrap: wrap; gap: 8px; }
.banner-acts button { height: 38px; padding: 0 14px; border-radius: 10px; background: var(--ink); color: var(--bg); font-weight: 700; font-size: 14px; }
.banner-acts button.ghost { background: transparent; color: inherit; border: 1px solid currentColor; }

/* Day head */
.day-head { margin: 22px 2px 4px; }
.day-head h2 { font-family: var(--f-display); font-weight: 800; font-size: 34px; line-height: .95; text-transform: uppercase; text-wrap: balance; }
.day-letter { color: var(--accent); }
.day-meta { margin-top: 7px; font-family: var(--f-mono); font-size: 11.5px; font-weight: 500; letter-spacing: .03em; text-transform: uppercase; color: var(--muted); }
.phase { margin-top: 8px; display: flex; gap: 8px; align-items: baseline; font-size: 14px; line-height: 1.4; }
.phase::before { content: ""; width: 8px; height: 8px; flex: none; border-radius: 2px; background: var(--accent); transform: translateY(-1px); }

/* Warm-up */
.warm { margin-top: 12px; border: 1.5px dashed var(--rule-strong); border-radius: var(--r); }
.warm.is-done { border-style: solid; border-color: var(--done-line); }
.warm-head { width: 100%; display: flex; align-items: center; gap: 10px; min-height: 50px; padding: 0 14px; }
.warm-title { flex: 1; text-align: left; font-family: var(--f-display); font-weight: 800; font-size: 19px; text-transform: uppercase; letter-spacing: .02em; }
.warm-count { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.chev { color: var(--muted); transition: transform .2s; }
.chev svg { width: 16px; height: 16px; }
.is-closed .chev { transform: rotate(-90deg); }
.warm-list { list-style: none; margin: 0; padding: 0 8px 6px; display: grid; gap: 2px; }
.warm-list:last-child { padding-bottom: 10px; }
.warm-sub { padding: 6px 14px 2px; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.warm-item { width: 100%; display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 6px 6px; border-radius: 10px; text-align: left; font-size: 15px; user-select: none; -webkit-user-select: none; }
.warm-item .box { width: 22px; height: 22px; border-radius: 7px; }
.warm-item .box svg { width: 13px; height: 13px; }
.warm-item.is-done .warm-t { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--faint); }

/* Exercise card */
.ex { margin-top: 12px; padding: 14px 12px 12px; background: var(--surface); border: 1px solid var(--rule); border-radius: var(--r); box-shadow: var(--lift); transition: border-color .2s; }
.ex.is-full { border-color: var(--done-line); }
.ex-head { display: grid; grid-template-columns: auto minmax(0, 1fr) auto auto; gap: 10px; align-items: start; padding-left: 2px; }
.ex-num { width: 20px; font-family: var(--f-display); font-weight: 800; font-size: 22px; line-height: 1; color: var(--faint); padding-top: 1px; }
.ex-title h3 { font-size: 18px; font-weight: 700; line-height: 1.2; text-wrap: balance; }
.ex-spec { margin-top: 3px; font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); }
.ex-note { margin-top: 3px; font-size: 13px; color: var(--muted); }
.ex-count { margin-top: 1px; padding: 3px 7px; border-radius: 7px; background: var(--surface-2); font-family: var(--f-mono); font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.ex.is-full .ex-count { background: var(--done); color: var(--done-ink); }
.ex-head .icon-btn { width: 36px; height: 32px; margin: -4px -4px 0 0; color: var(--muted); }
.ex-head .icon-btn svg { width: 20px; height: 20px; }

.load { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin: 12px 0 0 32px; }
.wt { display: flex; align-items: center; border: 1px solid var(--rule); border-radius: 12px; background: var(--surface-2); }
.step { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 11px; font-size: 24px; font-weight: 500; line-height: 1; color: var(--ink); }
.step:active { background: var(--accent-soft); }
.wt-field { display: flex; align-items: baseline; gap: 4px; padding: 0 2px; cursor: text; }
.wt-input { width: 3.3ch; height: 44px; padding: 0; border: 0; border-radius: 0; background: transparent; text-align: right; font-family: var(--f-display); font-weight: 800; font-size: 32px; line-height: 44px; color: var(--ink); -webkit-appearance: none; appearance: none; }
.wt-input::placeholder { color: var(--faint); }
.wt-input:focus { box-shadow: 0 2px 0 var(--accent); }
.wt-unit { font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.plates { display: flex; align-items: center; gap: 8px; min-width: 0; }
.plates:empty { display: none; }
.sleeve { position: relative; display: inline-flex; align-items: center; gap: 2px; height: 30px; padding: 0 12px 0 3px; flex: none; }
.sleeve::before { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 5px; transform: translateY(-50%); background: var(--steel); border-radius: 3px; }
.pl { position: relative; display: block; width: 7px; border-radius: 2px; }
.p45 { height: 30px; background: var(--plate-45); }
.p35 { height: 26px; background: var(--plate-35); }
.p25 { height: 22px; background: var(--plate-25); }
.p10 { height: 16px; background: var(--plate-10); box-shadow: inset 0 0 0 1px var(--rule-strong); }
.p5 { height: 13px; background: var(--plate-5); }
.p2 { height: 10px; background: var(--plate-2); }
.pl-t { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.bw { display: inline-block; padding: 5px 10px; border-radius: 8px; background: var(--surface-2); font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.last { margin: 10px 0 0 32px; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.last-k { margin-right: 6px; font-size: 10.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
.cue-slot:empty { display: none; }
.cue { margin: 10px 0 0 32px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 8px 8px 8px 12px; border-radius: 10px; background: var(--cue-bg); color: var(--cue); font-size: 13.5px; font-weight: 600; line-height: 1.35; }
.cue span { flex: 1 1 160px; }
.cue-btn { height: 34px; padding: 0 12px; border-radius: 8px; background: var(--ink); color: var(--bg); font-size: 13.5px; font-weight: 700; white-space: nowrap; }

.sets { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 6px; }
.set { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; border-radius: 12px; background: var(--surface-2); border: 1px solid transparent; transition: background .15s, border-color .15s; }
.set.is-done { background: var(--done-soft); border-color: var(--done-line); }
.set-check { display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 6px 6px 6px 12px; text-align: left; user-select: none; -webkit-user-select: none; min-width: 0; }
.box { width: 28px; height: 28px; flex: none; display: grid; place-items: center; border-radius: 8px; border: 2px solid var(--faint); color: transparent; transition: background .12s, border-color .12s; }
.box svg { width: 16px; height: 16px; }
.is-done .box { background: var(--done); border-color: var(--done); color: var(--done-ink); }
.set-label { font-weight: 700; font-size: 16px; white-space: nowrap; }
.reps { display: flex; align-items: center; padding-right: 2px; }
.step.sm { width: 42px; height: 46px; font-size: 22px; color: var(--muted); }
.reps-v { display: grid; justify-items: center; min-width: 46px; line-height: 1; }
.reps-v output { font-family: var(--f-display); font-weight: 800; font-size: 26px; line-height: 1; font-variant-numeric: tabular-nums; }
.reps-v small { margin-top: 2px; font-size: 9.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--faint); white-space: nowrap; }
.is-done .reps-v output { color: var(--done); }

.add-ex { width: 100%; height: 50px; margin-top: 12px; border-radius: var(--r); border: 1.5px dashed var(--rule-strong); color: var(--muted); font-weight: 600; font-size: 15px; }
.foot { margin: 16px 4px 0; font-size: 13px; color: var(--muted); line-height: 1.45; }

/* Cardio */
.specs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.spec { display: grid; gap: 4px; padding: 10px 12px; border-radius: 12px; background: var(--surface-2); }
.spec b { font-family: var(--f-display); font-weight: 800; font-size: 36px; line-height: .9; }
.spec b small { font-size: 20px; margin-left: 1px; }
.spec span { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.clock-wrap { display: flex; align-items: baseline; gap: 10px; margin-top: 16px; padding-left: 2px; }
.clock { min-width: 3.3ch; font-family: var(--f-display); font-weight: 800; font-size: 66px; line-height: .86; font-variant-numeric: tabular-nums; }
.clock-of { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.meter { display: block; height: 6px; margin-top: 12px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.meter > span { display: block; height: 100%; width: 0; background: var(--done); border-radius: 3px; transition: width .25s; }
.clock-acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.cardio-cue { margin: 12px 2px 2px; font-size: 14px; color: var(--muted); line-height: 1.45; }

/* Buttons */

/* ---------- Actions ---------- */
function toggleSet(day, id, i) {

function adjReps(day, id, i, dir) {

function adjWeight(day, id, dir) {

}

function startRamp(pct, weeks) {

function lastCheckinDate() { var d = null; measures.forEach(function (m) { if (!d || m.date > d) d = m.date; }); return d; }

/* Finish and reset */

  var st = S.days[day].startedAt, stale = st && ymd(st) !== ymd(Date.now());

    actions: [
      { label: 'Save to log and reset', kind: 'primary', fn: function () { var n = document.getElementById('finishNote'); finishDay(day, n ? n.value : ''); } },
      { label: 'Keep going' }

}
function finishDay(day, note) {
  var now = Date.now(), ds = S.days[day], prev = clone(ds), prevT = clone(U.cardioT);
  var started = ds.startedAt || now, stale = ymd(started) !== ymd(now);
  var ended = stale ? Math.max(started, ds.lastAt || started) : now;
  note = String(note || '').trim().slice(0, 300);
  var s;
  if (day === 'cardio') {
    var el = Math.min(cardioElapsed(), CARDIO_MIN * 60000);
    s = { id: newId(), type: 'cardio', day: 'cardio', date: ymd(started), startedAt: started, endedAt: ended,
      minutes: el > 0 ? Math.max(1, Math.round(el / 60000)) : ds.blocks.filter(Boolean).length * 10,
      blocks: ds.blocks.slice(), incline: 12, speed: '3.0', note: note, updatedAt: now };
    S.days.cardio = emptyCardio();

  } else {
    var ex = [], doneSets = 0, totalSets = 0;
    S.program[day].forEach(function (e) {
      var n = effSets(e), sets = [];
      totalSets += n;
      for (var i = 0; i < n; i++) { var d = isDone(day, e, i); if (d) doneSets++; sets.push({ r: repsAt(day, e, i), d: d }); }
      if (sets.some(function (x) { return x.d; })) ex.push({ id: e.id, name: e.name, kind: e.kind, w: hasLoad(e) ? numOrNull(S.weights[e.id]) : null, min: e.min, max: e.max, perSide: e.perSide, sets: sets });
    });
    s = { id: newId(), type: 'lift', day: day, date: ymd(started), startedAt: started, endedAt: ended, deload: !!S.settings.deload,
      doneSets: doneSets, totalSets: totalSets, ex: ex, note: note, updatedAt: now };
    S.days[day] = emptyLift();
  }
  sessions.push(s);
  delete U.warmOpen[day];
  stopRest();
  commit();
  window.scrollTo(0, 0);
  toast((day === 'cardio' ? 'Cardio' : 'Day ' + day) + ' saved to your log. Checklist reset.', function () {
    sessions = sessions.filter(function (x) { return x.id !== s.id; });

}

  openSheet({
    title: 'Erase everything',
    body: '<p>Deletes your log, weights, edits and settings from this phone. Back up first if you might want any of it later. This cannot be undone.</p>',
    actions: [{ label: 'Erase everything', kind: 'danger', fn: function () {
      sessions = [];
      measures = [];
      S = defaultState();
      U.cardioT = { running: false, startMs: 0, accMs: 0 }; U.rest = null; U.warmOpen = {}; U.view = 'workout'; U.tab = 'A';
      commit(); window.scrollTo(0, 0); toast('Everything erased.');
    } }, { label: 'Cancel' }]
  });
}

/* Backups */
function saveFile(filename, data, mime, onDone) {
  var blob;
  try { blob = new Blob([data], { type: mime }); } catch (e) { openCopySheet(filename, data); return; }
  var file = null;
  try { file = new File([blob], filename, { type: mime }); } catch (e) { file = null; }
  function download() {
    try {
      var url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = filename; a.rel = 'noopener';
      document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(url); if (a.parentNode) a.parentNode.removeChild(a); }, 2000);
      if (onDone) onDone();
    } catch (e) { openCopySheet(filename, data); }
  }
  var canShareFile = false;
  try { canShareFile = !!(file && navigator.share && navigator.canShare && navigator.canShare({ files: [file] })); } catch (e) { canShareFile = false; }
  if (canShareFile && isPhone()) {
    navigator.share({ files: [file] }).then(function () { if (onDone) onDone(); }, function (e) {
      if (e && e.name === 'AbortError') return;
      download();
    });
    return;
  }
  download();
}
function openCopySheet(filename, data) {
  openSheet({
    title: 'Copy your data',
    body: '<p>Saving a file did not work here. Copy this text into a note or a file named ' + esc(filename) + '.</p><textarea id="copyArea" class="copy-area" rows="8" readonly>' + esc(data) + '</textarea>',
    actions: [{ label: 'Copy', kind: 'primary', fn: function () {
      var ta = document.getElementById('copyArea');
      function fallback() { if (ta) { ta.focus(); ta.select(); } toast('Text selected. Use Copy from the menu.'); }
      try {
        if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(data).then(function () { toast('Copied.'); }, fallback);
        else fallback();
      } catch (e) { fallback(); }
      return true;
    } }, { label: 'Done' }]
  });
}
function backup() {
  var data = JSON.stringify({ app: 'recomp-log', v: 1, exportedAt: new Date().toISOString(), state: S, sessions: sessions, measures: measures }, null, 1);
  saveFile('recomp-log-backup-' + ymd(Date.now()) + '.json', data, 'application/json', function () {
    S.settings.lastBackup = Date.now();
    commit();
    toast('Backup saved. Keep it in Files or iCloud Drive.');
  });
}
function csvCell(v) { v = String(v == null ? '' : v); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function exportCsv() {
  var rows = [['date', 'workout', 'exercise', 'set', 'weight_lb', 'reps_or_seconds', 'done', 'note']];
  var items = sessions.map(function (s) { return { k: s.date, t: s.endedAt || 0, s: s }; }).concat(measures.map(function (m) { return { k: m.date, t: -1, m: m }; }));
  items.sort(function (a, b) { return a.k < b.k ? -1 : (a.k > b.k ? 1 : a.t - b.t); });
  items.forEach(function (it) {
    var s = it.s, m = it.m;
    if (m) {
      if (numOrNull(m.bw) != null) rows.push([m.date, 'Check-in', 'Body weight', '', m.bw, '', '', '']);
      if (numOrNull(m.waist) != null) rows.push([m.date, 'Check-in', 'Waist', '', '', m.waist + ' in', '', '']);
      return;
    }
    if (s.type === 'cardio') { rows.push([s.date, 'Cardio', '12-3-30 incline walk', '', '', (s.minutes || 0) + ' min', (Array.isArray(s.blocks) ? s.blocks.filter(Boolean).length : 0) + '/3 blocks', s.note || '']); return; }
    (Array.isArray(s.ex) ? s.ex : []).forEach(function (e, ei) {
      (Array.isArray(e.sets) ? e.sets : []).forEach(function (x, i) {
        rows.push([s.date, 'Day ' + s.day + (s.deload ? ' (deload)' : ''), e.name, i + 1, e.w == null ? '' : e.w, x.r, x.d ? 'yes' : 'no', ei === 0 && i === 0 ? (s.note || '') : '']);
      });
    });
  });
  if (rows.length === 1) { toast('Nothing logged yet.'); return; }
  saveFile('recomp-log-' + ymd(Date.now()) + '.csv', rows.map(function (r) { return r.map(csvCell).join(','); }).join('\n'), 'text/csv', function () { toast('Log exported.'); });
}
function readBackup(file) {
  if (!file) return;
  var r = new FileReader();
  r.onload = function () {
    var obj = null;
    try { obj = JSON.parse(String(r.result)); } catch (e) { obj = null; }
    if (!isObj(obj) || obj.app !== 'recomp-log' || !isObj(obj.state)) { toast('That file is not a Recomp backup.'); return; }
    var n = Array.isArray(obj.sessions) ? obj.sessions.filter(validSession).length : 0;
    var nm = Array.isArray(obj.measures) ? obj.measures.filter(validMeasure).length : 0;
    var when = obj.exportedAt ? new Date(obj.exportedAt).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) : 'an unknown date';
    openSheet({
      title: 'Restore backup',
      body: '<p>Backup from ' + esc(when) + ' with ' + n + ' logged workout' + (n === 1 ? '' : 's') + (nm ? ' and ' + nm + ' check-in' + (nm === 1 ? '' : 's') : '') + '.</p><p class="sheet-help">Your program, weights and settings switch to the backup. Its workouts and check-ins are added to your log, and nothing already logged is removed.</p>',
      actions: [{ label: 'Restore', kind: 'primary', fn: function () { applyBackup(obj); } }, { label: 'Cancel' }]
    });
  };
  r.onerror = function () { toast('Could not read that file.'); };
  r.readAsText(file);
}
function applyBackup(obj) {
  var st = normalizeState(obj.state);
  var incoming = (Array.isArray(obj.sessions) ? obj.sessions : []).filter(validSession).map(clone);
  var map = {};
  sessions.forEach(function (s) { map[s.id] = s; });
  incoming.forEach(function (s) {
    if (!map[s.id] || (Number(s.updatedAt) || 0) >= (Number(map[s.id].updatedAt) || 0)) map[s.id] = s;
  });
  var mmap = {};
  measures.forEach(function (m) { mmap[m.id] = m; });
  (Array.isArray(obj.measures) ? obj.measures : []).filter(validMeasure).map(clone).forEach(function (m) {
    if (!mmap[m.id] || (Number(m.updatedAt) || 0) >= (Number(mmap[m.id].updatedAt) || 0)) mmap[m.id] = m;
  });
  var defs = defaultState().weights;
  Object.keys(defs).forEach(function (k) { if (st.weights[k] == null && defs[k] != null) st.weights[k] = defs[k]; });
  var exported = Date.parse(obj.exportedAt);
  st.settings.lastBackup = Number.isFinite(exported) ? exported : Date.now();
  st.settings.introSeen = true;
  S = st;
  sessions = Object.keys(map).map(function (k) { return map[k]; });
  measures = Object.keys(mmap).map(function (k) { return mmap[k]; });
  U.tab = initialTab();
  commit();
  toast('Backup restored.');
}

/* ---------- Rest timer, sound, vibration, screen ---------- */
var actx = null;
function unlockAudio() {
  if (!S.settings.sound) return;
  try {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!actx) actx = new AC();
    if (actx.state === 'suspended') actx.resume();
  } catch (e) {}
}
function beep() {
  if (!S.settings.sound || !actx) return;
  try {
    var t0 = actx.currentTime + 0.02;
    [[0, 880], [0.24, 1175]].forEach(function (p) {
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = p[1];
      g.gain.setValueAtTime(0.0001, t0 + p[0]);
      g.gain.exponentialRampToValueAtTime(0.4, t0 + p[0] + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + p[0] + 0.2);
      o.connect(g); g.connect(actx.destination);
      o.start(t0 + p[0]); o.stop(t0 + p[0] + 0.22);
    });
  } catch (e) {}
}
function buzz(p) { if (!S.settings.vibrate || !canVibrate) return; try { navigator.vibrate(p); } catch (e) {} }

function startRest(sec, label) { U.rest = { endsAt: Date.now() + sec * 1000, total: sec, label: label || '', fired: false }; saveLocal(); paintRest(); ensureTicker(); }
function stopRest() { if (!U.rest) return; U.rest = null; saveLocal(); paintRest(); ensureTicker(); }
function adjRest(d) {
  if (!U.rest) return;
  var now = Date.now(), left = Math.max(0, U.rest.endsAt - now) + d * 1000;
  if (left <= 0) { stopRest(); return; }
  U.rest.endsAt = now + left;
  U.rest.total = Math.max(U.rest.total + d, Math.ceil(left / 1000));
  U.rest.fired = false;
  saveLocal(); paintRest(); ensureTicker();
}
function paintRest() {
  var box = $('#rest'), wasHidden = box.hidden, show = !!U.rest && U.view === 'workout';
  box.hidden = !show;
  if (show) {
    var left = (U.rest.endsAt - Date.now()) / 1000;
    if (left <= 0) {
      if (!U.rest.fired) { U.rest.fired = true; if (left > -3) { beep(); buzz([180, 90, 180]); } saveLocal(); }
      box.classList.add('is-over');
      $('#restK').textContent = 'Rest over';
      $('#restClock').textContent = 'Go';
      $('#restBar').style.width = '100%';
      if (left < -15) { U.rest = null; saveLocal(); box.hidden = true; ensureTicker(); }
    } else {
      box.classList.remove('is-over');
      $('#restK').textContent = 'Rest';
      $('#restClock').textContent = fmtClock(Math.ceil(left));
      $('#restBar').style.width = Math.max(0, Math.min(100, (1 - left / U.rest.total) * 100)).toFixed(1) + '%';
    }
    $('#restLabel').textContent = U.rest ? 'after ' + U.rest.label : '';
  }
  if (wasHidden !== box.hidden) updateDockSpace();
}
var tickId = null;
function ensureTicker() {
  var need = !!U.rest || U.cardioT.running;
  if (need && !tickId) tickId = setInterval(tick, 250);
  else if (!need && tickId) { clearInterval(tickId); tickId = null; }
}
function tick() { paintRest(); if (U.cardioT.running) cardioTick(); }
function cardioTick() {
  var el = cardioElapsed(), target = CARDIO_MIN * 60000, b = S.days.cardio.blocks, changed = false;
  for (var i = 0; i < 3; i++) if (!b[i] && el >= (i + 1) * 600000) { b[i] = true; changed = true; }
  if (el >= target) {
    U.cardioT = { running: false, startMs: 0, accMs: target };
    S.days.cardio.lastAt = Date.now();
    beep(); buzz([200, 100, 200]);
    toast('30 minutes done. Tap Finish to log it.');
    changed = true;
  }
  if (changed) { if (!S.days.cardio.startedAt) S.days.cardio.startedAt = Date.now(); commit(); return; }
  if (U.view === 'workout' && U.tab === 'cardio') {
    var c = document.getElementById('cardioClock'); if (c) c.textContent = fmtClock(el / 1000);
    var bar = document.getElementById('cardioBar'); if (bar) bar.style.width = (el / target * 100).toFixed(1) + '%';
  }
}
var wake = null, wakeBusy = false;
function syncWake() {
  var want = S.settings.wake && document.visibilityState === 'visible' && inProgress();
  if (wakeBusy) return;
  if (want && !wake) {
    if (!('wakeLock' in navigator)) { markWakeErr(); return; }
    wakeBusy = true;
    navigator.wakeLock.request('screen').then(function (lock) {
      wakeBusy = false; wake = lock;
      lock.addEventListener('release', function () { wake = null; });
      if (U.wakeErr) { U.wakeErr = false; if (U.view === 'settings') renderMain(); }
    }, function () { wakeBusy = false; wake = null; markWakeErr(); });
  } else if (!want && wake) {
    var w = wake; wake = null;
    try { w.release(); } catch (e) {}
  }
}
function markWakeErr() { if (!U.wakeErr) { U.wakeErr = true; if (U.view === 'settings') renderMain(); } }
function requestPersist() { try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {}); } catch (e) {} }

/* ---------- Sheet and toast ---------- */
var sheetCtx = null;
function openSheet(ctx) {
  sheetCtx = ctx;
  $('#sheetTitle').textContent = ctx.title;
  $('#sheetBody').innerHTML = ctx.body || '';
  $('#sheetActions').innerHTML = (ctx.actions || []).map(function (a, i) {
    return '<button type="button" class="btn ' + (a.kind || 'ghost') + '" data-sheet="' + (a.fn ? 'act:' + i : 'cancel') + '">' + esc(a.label) + '</button>';
  }).join('');
  $('#sheet').hidden = false;
  document.body.classList.add('no-scroll');
  var f = document.querySelector('#sheetActions .btn');
  if (f) { try { f.focus({ preventScroll: true }); } catch (e) {} }
}
function closeSheet(cancelled) {
  var ctx = sheetCtx;
  sheetCtx = null;
  $('#sheet').hidden = true;
  document.body.classList.remove('no-scroll');
  if (cancelled && ctx && ctx.onCancel) ctx.onCancel();
}
function onSheetClick(btn) {
  var k = btn.dataset.sheet;
  if (!sheetCtx) return;
  if (k === 'cancel') { closeSheet(true); return; }
  if (k.indexOf('act:') === 0) {
    var a = sheetCtx.actions[Number(k.slice(4))];
    var keep = a && a.fn ? a.fn() : false;
    if (keep !== true && sheetCtx) closeSheet(false);
    return;
  }
  if (sheetCtx.onClick) sheetCtx.onClick(k, btn);
}
var toastT = null, toastUndo = null;
function toast(msg, undo) {
  $('#toastMsg').textContent = msg;
  toastUndo = typeof undo === 'function' ? undo : null;
  $('#toastUndo').hidden = !toastUndo;
  $('#toast').hidden = false;
  clearTimeout(toastT);
  toastT = setTimeout(hideToast, toastUndo ? 7000 : 3400);
}
function hideToast() { $('#toast').hidden = true; toastUndo = null; }

/* ---------- Events ---------- */
document.addEventListener('click', function (e) {
  var sb = e.target.closest('[data-sheet]');
  if (sb && sb.closest('#sheet')) { onSheetClick(sb); return; }
  var el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  var a = el.dataset.act, day = el.dataset.day, id = el.dataset.ex, i = el.dataset.i != null ? Number(el.dataset.i) : null;
  switch (a) {
    case 'tab': U.tab = el.dataset.tab; render(); window.scrollTo(0, 0); break;
    case 'view': U.view = (el.id && U.view === el.dataset.view) ? 'workout' : el.dataset.view; U.openSess = null; U.confirmDel = null; render(); window.scrollTo(0, 0); break;
    case 'set-toggle': toggleSet(day, id, i); break;
    case 'reps-dec': adjReps(day, id, i, -1); break;
    case 'reps-inc': adjReps(day, id, i, 1); break;
    case 'wt-dec': adjWeight(day, id, -1); break;
    case 'wt-inc': adjWeight(day, id, 1); break;
    case 'apply-bump': applyBump(day, id); break;
    case 'apply-ramp': applyRamp(day, id); break;
    case 'ramp-open': openRamp(); break;
    case 'ramp-dismiss': S.settings.rampOffered = true; commit(); break;
    case 'body-add': openCheckin(null); break;
    case 'body-edit': openCheckin(el.dataset.id); break;
    case 'ck-later': U.ckSnooze = ymd(Date.now()); saveLocal(); renderMain(); break;
    case 'warm-toggle': toggleWarm(day, el.dataset.k); break;
    case 'warm-collapse': U.warmOpen[day] = el.getAttribute('aria-expanded') !== 'true'; saveLocal(); renderMain(); break;
    case 'ex-edit': openEdit(day, id, false); break;
    case 'ex-add': addExercise(day); break;
    case 'finish': openFinish(day || U.tab); break;
    case 'reset': openReset(day || U.tab); break;
    case 'rest-adj': adjRest(Number(el.dataset.d)); break;
    case 'rest-skip': stopRest(); break;
    case 'cardio-start': cardioStart(); break;
    case 'cardio-pause': cardioPause(); break;
    case 'cardio-timer-reset': cardioTimerReset(); break;
    case 'cardio-block': toggleBlock(i); break;
    case 'deload-on': S.settings.deload = true; commit(); toast('Deload week on. Half the sets at the same weights.'); break;
    case 'deload-off': S.settings.deload = false; commit(); toast('Deload week off.'); break;
    case 'intro-ok': S.settings.introSeen = true; commit(); break;
    case 'hide-install': U.hideInstall = true; saveLocal(); renderMain(); break;
    case 'sess-toggle': U.openSess = U.openSess === el.dataset.id ? null : el.dataset.id; U.confirmDel = null; renderMain(); break;
    case 'sess-del':
      if (U.confirmDel === el.dataset.id) { U.confirmDel = null; deleteSession(el.dataset.id); }
      else { U.confirmDel = el.dataset.id; renderMain(); }
      break;
    case 'setting': toggleSetting(el.dataset.key); break;
    case 'backup': backup(); break;
    case 'csv': exportCsv(); break;
    case 'restore': document.getElementById('restoreInput').click(); break;
    case 'restore-program': openRestoreProgram(); break;
    case 'erase': openErase(); break;
    case 'toast-undo': var f = toastUndo; hideToast(); if (f) f(); break;
  }
});
document.addEventListener('change', function (e) {
  var t = e.target;
  if (t.classList && t.classList.contains('wt-input')) { onWeightInput(t); return; }
  if (t.id === 'setStart') { S.settings.startDate = /^\d{4}-\d{2}-\d{2}$/.test(t.value) ? t.value : ''; commit(); return; }
  if (t.id === 'setBar') { var v = Number(t.value); S.settings.bar = v > 0 && v <= 100 ? v : 45; commit(); return; }
  if (t.id === 'rampPct') { var pv = document.getElementById('rampPrev'); if (pv) pv.innerHTML = rampPreview(Number(t.value)); return; }
  if (t.id === 'restoreInput') { var file = t.files && t.files[0]; t.value = ''; readBackup(file); }
});
document.addEventListener('focusin', function (e) {
  var t = e.target;
  if (t.classList && t.classList.contains('wt-input')) setTimeout(function () { try { t.setSelectionRange(0, t.value.length); } catch (x) {} }, 0);
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && sheetCtx) closeSheet(true);
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('wt-input')) e.target.blur();
});
document.addEventListener('visibilitychange', function () {
  if (document.visibilityState === 'visible') { tick(); safeRender(); }
  else saveLocal();
  syncWake();
});
window.addEventListener('pagehide', saveLocal);
window.addEventListener('resize', updateDockSpace);

/* ---------- Start ---------- */
U.tab = initialTab();
render();
setTimeout(updateDockSpace, 300);
requestPersist();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
}
})();
</script>
